extName: JWT Inspector
extDescription: Detecta, inspecciona, verifica y crea JSON Web Tokens desde un panel lateral.
app:
  loading: Cargando tokens
  loadError: No se pudieron leer los tokens guardados. Vuelve a abrir el panel para reintentar.
parts:
  header: header
  payload: payload
  signature: firma
add:
  open: agregar token
  title: Agregar un token
  label: Token
