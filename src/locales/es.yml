  neverExpires: No expira
time:
  left: quedan $1
  ago: hace $1
  in: en $1
ruler:
  label: Vida útil desde $1 hasta $2. Ahora en el $3 por ciento.
  now: ahora
mask:
  masked: oculto
  reveal: mostrar
  hide: ocultar
  revealField: mostrar $1
  hideField: ocultar $1
  revealed: $1 visible
  hidden: $1 oculto
claims:
  iss:
    title: Emisor
    summary: Quién emitió el token.
  sub:
    title: Sujeto
    summary: Quién o qué describe el token.
  aud:
    title: Audiencia
    summary: A quién va destinado el token.
  exp:
    title: Expiración
    summary: Después de este momento el token debe rechazarse.
  nbf:
    title: No antes de
    summary: Antes de este momento el token debe rechazarse.
  iat:
    title: Emitido el
    summary: Cuándo se emitió el token.
  jti:
    title: ID del JWT
    summary: Identificador único, sirve para detectar reutilizaciones.
  name:
    title: Nombre completo
    summary: Dato personal del sujeto.
  given_name:
    title: Nombre
    summary: Dato personal del sujeto.
  family_name:
    title: Apellido
    summary: Dato personal del sujeto.
  middle_name:
    title: Segundo nombre
    summary: Dato personal del sujeto.
  nickname:
    title: Apodo
    summary: Dato personal del sujeto.
  preferred_username:
    title: Usuario preferido
    summary: El nombre con que el sujeto prefiere que lo llamen.
  email:
    title: Email
    summary: Dato personal del sujeto.
  phone_number:
    title: Teléfono
    summary: Dato personal del sujeto.
  address:
    title: Dirección
    summary: Dato personal del sujeto.
  birthdate:
    title: Fecha de nacimiento
    summary: Dato personal del sujeto.
headerParams:
  alg:
    title: Algoritmo
    summary: Algoritmo con que se firmó el token.
  jku:
    title: URL del JWK Set
    summary: Dónde obtener el conjunto de claves que contiene la clave de firma.
  jwk:
    title: JSON Web Key
    summary: Clave pública incluida en el header.
  kid:
    title: ID de clave
    summary: Qué clave firmó el token.
  x5u:
    title: URL X.509
    summary: Dónde obtener la cadena de certificados de firma.
  x5c:
    title: Cadena de certificados X.509
    summary: Cadena de certificados incluida en el header.
  x5t:
    title: Huella X.509
    summary: Huella SHA-1 del certificado de firma.
  x5tS256:
    title: Huella X.509 SHA-256
    summary: Huella SHA-256 del certificado de firma.
  typ:
    title: Tipo
    summary: Tipo de medio del token completo.
  cty:
    title: Tipo de contenido
    summary: Tipo de medio del payload.
  crit:
    title: Crítico
    summary: Extensiones que el receptor debe entender para aceptar el token.
