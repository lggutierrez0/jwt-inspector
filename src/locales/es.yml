  submit: agregar token
  cancel: cancelar
  errors:
    empty: Primero pega un token.
    wrongPartCount: Un JWT tiene 3 partes separadas por puntos. Este texto tiene $1.
    invalidBase64Url: El $1 no es base64url válido.
